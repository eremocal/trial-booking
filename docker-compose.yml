name: trial-class-booking

# Every setting comes from .env at the repo root (cp .env.example .env).
# Compose refuses to start if one is missing rather than guessing a value.

services:
  db:
    image: postgres:17-alpine
    container_name: trial-class-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      # Read by docker/init-test-db.sh to create the test database.
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:?copy .env.example to .env}
    ports:
      - "${POSTGRES_PORT:?copy .env.example to .env}:5432"
    volumes:
      - trial-class-booking-db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: trial-class-booking-api
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      # Inside the compose network the database is reachable by service name.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      API_PORT: ${API_PORT:?copy .env.example to .env}
    ports:
      - "${API_PORT:?copy .env.example to .env}:${API_PORT:?copy .env.example to .env}"
    depends_on:
      db:
        condition: service_healthy
    # Readiness, not liveness: the container applies migrations and seeds before
    # it serves traffic, so "the process started" is not "requests will work".
    # /health round-trips the database.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:$${API_PORT}/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      # Covers the first boot, where migrate + seed run before the server listens.
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The BROWSER calls this, and the browser runs on the host.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?copy .env.example to .env}
    container_name: trial-class-booking-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      # Wait until the API can serve requests, not just until it has started.
      api:
        condition: service_healthy
    # So that `docker compose up --wait` returns only once the site actually
    # serves a page, rather than the moment the process starts.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  trial-class-booking-db-data:
